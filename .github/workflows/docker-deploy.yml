name: Deploy Docker Container

on:
  push:
    branches:
      - main
      
jobs:

  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
    - uses: actions/checkout@v3

    - name: Trigger deploy script
      env:
        SERVER_HOST: ${{ secrets.SSH_HOST }}
        SERVER_USER: ${{ secrets.SSH_USERNAME }}
      run: |

        mkdir -p ~/.ssh/
        echo "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        # Add the server's host key to known_hosts
        ssh-keyscan -H ${{ secrets.SSH_HOST }}

        # delete folder in temp staging directory if it exists
        ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} -p ${{ secrets.SSH_PORT }} "\
          cd ~/website/SPS-lunch-petition-website; \
          ./deploy.sh"